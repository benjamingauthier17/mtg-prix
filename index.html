<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark light" />
<title>MTG Prix CA</title>
<style>
	:root { --bg: #0b0f17; --card: #10151f; --text: #e2e8f0; --muted: #94a3b8; --line: #ffffff14; --gold: #f5b14c; }
	@media (prefers-color-scheme: light) {
		:root { --bg: #f3f4f7; --card: #ffffff; --text: #1e293b; --muted: #5b6678; --line: #1018271a; --gold: #c2761f; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
		background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
	main { width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--line);
		border-radius: 18px; padding: 28px 24px; text-align: center; }
	h1 { margin: 12px 0 6px; font-size: 1.25rem; }
	p { margin: 0; color: var(--muted); font-size: .95rem; }
	.logo { font-weight: 800; letter-spacing: -.02em; }
	.logo span { color: var(--gold); }
	.spin { width: 28px; height: 28px; margin: 18px auto 0; border-radius: 50%;
		border: 3px solid var(--line); border-top-color: var(--gold); animation: s 1s linear infinite; }
	@keyframes s { to { transform: rotate(360deg); } }
	button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
		background: linear-gradient(90deg, #f5b14c, #e2683c); color: #0b0f17; cursor: pointer; }
	small { display: block; margin-top: 16px; color: var(--muted); font-size: .75rem; }
	[hidden] { display: none; }
</style>
</head>
<body>
<main>
	<div class="logo">MTG Prix <span>CA</span></div>
	<section id="wait">
		<h1>Connexion au site…</h1>
		<p>Une petite seconde.</p>
		<div class="spin" aria-hidden="true"></div>
	</section>
	<section id="closed" hidden>
		<h1>Le site est fermé pour le moment</h1>
		<p>L'ordi qui fait tourner le site est éteint. Réessaie un peu plus tard.</p>
		<button type="button" onclick="location.reload()">Réessayer</button>
	</section>
	<small>Lien mis à jour le 4 novembre 2026 à 19 h 48</small>
</main>
<script>
(function () {
	var cfg = {"target":null,"base":"/mtg-prix/"};
	function closed() {
		document.getElementById("wait").hidden = true;
		document.getElementById("closed").hidden = false;
	}
	if (!cfg.target) return closed();
	// Chemin demandé, sans le préfixe du dépôt GitHub Pages.
	var path = location.pathname;
	if (path.indexOf(cfg.base) === 0) path = "/" + path.slice(cfg.base.length);
	if (path === "/index.html" || path === "/404.html") path = "/";
	var dest = cfg.target + path + location.search + location.hash;
	var ctrl = "AbortController" in window ? new AbortController() : null;
	var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
	fetch(cfg.target + "/api/health", { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
		.then(function (r) { if (!r.ok) throw new Error(); location.replace(dest); })
		.catch(closed)
		.finally(function () { clearTimeout(timer); });
})();
</script>
</body>
</html>
