<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark light" />
<title>MTG Prix CA</title>
<style>
	:root { --bg: #0b0f17; --card: #10151f; --text: #e2e8f0; --muted: #94a3b8; --line: #ffffff14; --gold: #f5b14c; }
	@media (prefers-color-scheme: light) {
		:root { --bg: #f3f4f7; --card: #ffffff; --text: #1e293b; --muted: #5b6678; --line: #1018271a; --gold: #c2761f; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
		background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
	main { width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--line);
		border-radius: 18px; padding: 28px 24px; text-align: center; }
	h1 { margin: 12px 0 6px; font-size: 1.25rem; }
	p { margin: 0; color: var(--muted); font-size: .95rem; }
	.logo { font-weight: 800; letter-spacing: -.02em; }
	.logo span { color: var(--gold); }
	.spin { width: 28px; height: 28px; margin: 18px auto 0; border-radius: 50%;
		border: 3px solid var(--line); border-top-color: var(--gold); animation: s 1s linear infinite; }
	@keyframes s { to { transform: rotate(360deg); } }
	button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
		background: linear-gradient(90deg, #f5b14c, #e2683c); color: #0b0f17; cursor: pointer; }
	button:disabled { opacity: .6; cursor: wait; }
	#auto { margin-top: 10px; font-size: .85rem; }
	small { display: block; margin-top: 16px; color: var(--muted); font-size: .75rem; }
	[hidden] { display: none; }
</style>
</head>
<body>
<main>
	<div class="logo">MTG Prix <span>CA</span></div>
	<section id="wait">
		<h1>Connexion au site…</h1>
		<p>Une petite seconde.</p>
		<div class="spin" aria-hidden="true"></div>
	</section>
	<section id="closed" hidden>
		<h1>Le site est fermé pour le moment</h1>
		<p>L'ordi qui fait tourner le site est éteint, ou il vient de redémarrer.</p>
		<p id="auto">Cette page réessaie toute seule : elle t'enverra sur le site dès qu'il sera ouvert.</p>
		<button type="button" id="retry">Réessayer maintenant</button>
	</section>
	<small>Lien mis à jour le 5 novembre 2026 à 20 h 54</small>
</main>
<script>
(function () {
	var cfg = {"target":null,"base":"/mtg-prix/"};
	var wait = document.getElementById("wait");
	var closedBox = document.getElementById("closed");
	var retry = document.getElementById("retry");
	var timer = null;
	// Chemin demandé, sans le préfixe du dépôt GitHub Pages.
	var path = location.pathname;
	if (path.indexOf(cfg.base) === 0) path = "/" + path.slice(cfg.base.length);
	if (path === "/index.html" || path === "/404.html") path = "/";

	// Le site répond-il à cette adresse ? Si oui, on y va.
	function tryTarget(target) {
		if (!target) return Promise.resolve(false);
		var ctrl = "AbortController" in window ? new AbortController() : null;
		var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
		return fetch(target + "/api/health", { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
			.then(function (r) {
				if (!r.ok) return false;
				location.replace(target + path + location.search + location.hash);
				return true;
			})
			.catch(function () { return false; })
			.finally(function () { clearTimeout(t); });
	}

	// Après un redémarrage, GitHub met environ une minute à publier le nouveau lien :
	// on relit la version la plus récente de cette page (sans cache) pour l'y trouver.
	function latestTarget() {
		return fetch(cfg.base + "index.html?v=" + Date.now(), { cache: "no-store" })
			.then(function (r) { return r.text(); })
			.then(function (html) {
				var start = html.indexOf("var cfg = ");
				var end = html.indexOf("};", start);
				if (start < 0 || end < 0) return null;
				return JSON.parse(html.slice(start + 10, end + 1)).target;
			})
			.catch(function () { return null; });
	}

	function attempt(first) {
		clearTimeout(timer);
		retry.disabled = true;
		var check = first ? tryTarget(cfg.target) : latestTarget().then(tryTarget);
		check.then(function (ok) {
			if (ok) return;
			wait.hidden = true;
			closedBox.hidden = false;
			retry.disabled = false;
			timer = setTimeout(function () { attempt(false); }, 15000);
		});
	}
	retry.addEventListener("click", function () { attempt(false); });
	attempt(true);
})();
</script>
</body>
</html>
